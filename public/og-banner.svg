<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .masthead { font-family: 'Newsreader', Georgia, serif; font-weight: 500; fill: #181716; }
      .creed { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 4px; fill: #847e75; text-transform: uppercase; }
      .marathi { font-family: 'Mukta', sans-serif; font-size: 32px; fill: #524f4a; }
      .tagline { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 26px; fill: #847e75; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#faf8f5" />
  <rect x="50" y="50" width="1100" height="530" fill="#ffffff" stroke="#e8e3da" stroke-width="1.5" rx="6" />

  <text x="120" y="150" class="creed">इन्स्पायर // CURATED THOUGHTS &amp; REFLECTIONS</text>
  <text x="120" y="260" class="masthead" font-size="76">The Pathan Archive</text>
  <text x="120" y="335" class="marathi">संकलन आणि विचार: <tspan font-weight="700" fill="#1e3a8a">पठाण सर (Pathan Sir)</tspan> • धर्माबाद</text>

  <line x1="120" y1="390" x2="1080" y2="390" stroke="#e8e3da" stroke-width="1" />

  <text x="120" y="450" class="tagline">"जीवनाला दिशा देणारे जगातील सर्वोत्तम विचार, कोट्स, पॉडकास्ट आणि व्हिडीओ."</text>
  <text x="120" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#15803d" font-weight="600">WhatsApp: +91 9011291176</text>
</svg>
